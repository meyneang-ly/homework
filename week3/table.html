<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student List</title>
</head>
<body>
<div>
    <h1>Student List</h1>
    <table border="1" cellspacing="0" cellpadding="8">
        <thead>
            <tr>
                <th>ID</th>
                <th>name</th>
                <th>Grand</th>
                <th>Major</th>
            </tr>
        <thread>
        <tbody>
            <tr>
                <td>1</td>

            </tr>
            <tr>
                <td>2</td>
                <td>Brian Lee</td>
                <td>B+</td>
                <td>Mathematics</td>
             </tr>
            <tbody>
        </table>
    </div>
<div>
        <h1>student Schedule (with colspan)</h1>

            <thead>
            <tr>
                <th colspan="2">Name</th>
                <th>Age</th>
            </tr>
            </thead>
            <tbody>

                    <td>Jill</td>

                <tr>
                    <td>Eve</td>
                    <td>jackson</td>

                </tr>

        </table>
    </div>
<div>
    <h2>Student Phone List (with rowspan)</h2>
    <table border="1" cellspacing="0" cellpadding="8">
        <tr>
            <th>Name</th>
            <td>Jill</td>
        </tr>
        <tr>
            <th rowspan="2">Phone</th>

        </tr>
        <tr>
            <td>555-1234</td>
        </tr>
    </div>
</body>
</html>
