<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Practice Webpage</title>
    
</head>
<body>

    <header>
        <h1>Student Practice Webpage</h1
        <p>HTML + CSS Practice (Form + table Advanced)</p>
    </header>

    <div class="container">

        <section class="card">
            
            <h2 id="image-content">Image</h2>
        <img src="/week3/images/rabbit.png" alt="Sample Image" width="300" height="300">
        
        </section>

        <section class="card">

            <h2>Advanced Table</h2>
            <table border="1" cellspacing="0" cellpadding="8">
                <thead>
                <tr>

                    <th rowspan="2">Name</th>
                    <th colspan="2">Scores</th>
                    <th rowspan="2">Grade</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <th>Math</th>
                    <th>CS</th>
                </tr>
                <tr>
                    <td>Alice</td>
                    <td>90</td>
                    <td>95</td>
                    <td>A</td>
                </tr>
                <tr>
                    <td>Bob</td>
                    <td>80</td>
                    <td>85</td>
                    <td>B</td>
                </tr>

            </table>

        </section>

        <section class="card form-section">

            <h2>Form 1: Basic Info</h2>

            <form>

                <label>Name *</label>
                <input type="text" required>
                <label>Email *</label>
                <input type="email" required>
                <label>Password *</label>
                <input type="password" required>
                <label>Upload File</label>
                <input type="file">

                <div class="button-group">

                    <button type="submit">Submit</button>
                    <button type="reset">Reset</button>

                </div>

            </form>

        </section>


        <section class="card form-section">

            <h2>Form 2: Survey Form</h2>

            <form>

                <label>Choose Course *</label>

                <select required>

                    <option value="">-- Select --</option>
                    <option>HTML</option>
                    <option>CSS</option>
                    <option>JavaScript</option>

                </select>

                <label>Gender</label>

                <div class="radio-group">

                    <input type="radio" name="gender"> Male
                    <input type="radio" name="gender"> Female

                </div>

                <label>Skills</label>

                <div class="checkbox-group">

                    <input type="checkbox"> HTML
                    <input type="checkbox"> CSS
                    <input type="checkbox"> JS

                </div>

                <label>Phone *</label>
                <input type="tel" required>
                <label>Message</label>
                <textarea rows="5"></textarea>
                <button type="submit">Send</button>

            </form>
        </section>

        </div>

</body>
</html>
