<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Practice Webpage</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing:border-box;
    border-radius: 15px;
}

body{
    font-family:'Times New Roman', Times, serif;
    background:#adf1eb;
}

.header{
    background:#cf96c9;
    color:white;
    text-align: center;
    padding: 30px;

}

.header h1{
    margin-bottom:10px;
    font-size:30px;
}

.header p{
    font-size:15px;
}

.container{
    padding:15px;
}

.card{
    background:white;
    margin-bottom:20px;
    padding:25px;
    border-radius:15px;
}

.card h2{
    margin-bottom:20px;
}

.image-box img{
    width:400px;
    height:300px;
    border-radius:10px;
}


.circle-img{
    width:300px !important;
    height:300px !important;
    border-radius:100% !important;
}

.oval-img{
    width:300px !important;
    height:200px !important;
    border-radius:100% !important;
}

table{
    width:100%;
    border-collapse:collapse;
    text-align:center;
}

th{
    background: #cf96c9;
    color:white;
    padding:10px;
    border:2px solid #ddd;
    border-radius: 0;
}

td{
    padding:10px;
    border:2px solid #ddd;
    border-radius: 0;
}


.form-container{
    width:50%;
    margin:auto;
}

form{
    display:flex;
    flex-direction:column;
}

label{
    margin-top:10px;
    margin-bottom:5px;
    font-weight:bold;
}

input,
select,
textarea{
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

.inline{
    margin-top:5px;
}

button{
    width:fit-content;
    padding:10px 20px;
    margin-top:15px;
    background:#4a90e2;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.button-group{
    display:flex;
    gap:10px;
}

</style>
</head>



<body>
<div class="header">
    <h1>Student Practice Webpage</h1>
    <p>HTML + CSS Practice (Forms + Table Advanced)</p>
</div>

<div class="container">

    <div class="card image-box">
        <h2>Image Section</h2>

        <img src="/week3/images/mountain.png"
        alt="Nature Image">
    </div>

    <div class="card image-box">
        <h2>Image Circle</h2>

        <img class="circle-img"
        src="/week3/images/mountain.png"
        alt="Circle Image">
    </div>

    <div class="card image-box">
        <h2>Image Oval</h2>

        <img class="oval-img"
        src="/week3/images/mountain.png"
        alt="Oval Image">
    </div>

    <div class="card">

        <h2>Advanced Table</h2>

        <table>

            <tr>
                <th rowspan="2">Name</th>
                <th colspan="2">Scores</th>
                <th rowspan="2">Grade</th>
            </tr>

            <tr>
                <th>Math</th>
                <th>CS</th>
            </tr>

            <tr>
                <td>Alice</td>
                <td>90</td>
                <td>95</td>
                <td>A</td>
            </tr>

            <tr>
                <td>Bob</td>
                <td>80</td>
                <td>85</td>
                <td>B</td>
            </tr>

        </table>

    </div>

    <div class="card form-container">

        <h2>Form 1: Basic Info</h2>

        <form>

            <label>Name *</label>
            <input type="text">

            <label>Email *</label>
            <input type="email">

            <label>Password *</label>
            <input type="password">

            <label>Upload File</label>
            <input type="file">

            <div class="button-group">
                <button type="submit">Submit</button>
                <button type="reset">Reset</button>
            </div>

        </form>

    </div>
